name: ${COMPOSE_PROJECT_NAME:-aim-studio}
x-build: &build
  NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
  NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.28-alpine}
  NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
  NEXT_PUBLIC_API_MOCK: 'false'
  NEXT_PUBLIC_API_BASE: ''
  NEXT_PUBLIC_WEB_URL: ${PUBLIC_URL:-http://localhost:3000}
  NEXT_PUBLIC_EDITOR_URL: ${PUBLIC_URL:-http://localhost:3000}
  NEXT_PUBLIC_MOBILE_URL: ${PUBLIC_URL:-http://localhost:3000}/m
  NEXT_PUBLIC_DOCS_URL: ${DOCS_PUBLIC_URL:-http://localhost:3002}
  NEXT_PUBLIC_STORYBOOK_URL: ${STORYBOOK_PUBLIC_URL:-}
  NEXT_DIST_DIR: ${NEXT_DIST_DIR:-.next}
  API_INTERNAL_URL: http://api:4000
  MOBILE_INTERNAL_URL: http://mobile:3000
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }
x-api-env: &api-env
  DATABASE_URL: postgresql://aim:${POSTGRES_PASSWORD:?请先运行部署脚本生成数据库密码}@postgres:5432/aim
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?请先运行部署脚本生成认证密钥}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
  NODE_ENV: ${APP_ENV:-development}
  PROVIDER_MODE: ${PROVIDER_MODE:-disabled}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-AIM Studio <noreply@aim.local>}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_PATH: /data/files
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
  WORKSPACE_STORAGE_BYTES: ${WORKSPACE_STORAGE_BYTES:-1073741824}
  FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
services:
  postgres:
    <<: *runtime
    image: postgres:17-alpine
    environment: { POSTGRES_USER: aim, POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}', POSTGRES_DB: aim }
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U aim -d aim']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: ${IMAGE_PREFIX:-aim-studio}/api:${IMAGE_TAG:-0.2.0}
    build: { context: .., dockerfile: deploy/Dockerfile, target: api, args: *build }
    environment: *api-env
    command: [node, --import, tsx, node_modules/@aim/db/src/migrate.ts]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { disable: true }
    restart: 'no'
  api:
    <<: *runtime
    image: ${IMAGE_PREFIX:-aim-studio}/api:${IMAGE_TAG:-0.2.0}
    build: { context: .., dockerfile: deploy/Dockerfile, target: api, args: *build }
    environment: *api-env
    volumes: [files:/data/files]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    <<: *runtime
    image: ${IMAGE_PREFIX:-aim-studio}/api:${IMAGE_TAG:-0.2.0}
    command: [node, dist/worker.js]
    environment: *api-env
    volumes: [files:/data/files]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs'),p=require('path'),os=require('os');process.exit(Date.now()-Number(fs.readFileSync(p.join(os.tmpdir(),'aim-worker-heartbeat'),'utf8'))<30000?0:1)",
        ]
      interval: 10s
      start_period: 30s
      retries: 3
  web:
    <<: *runtime
    image: ${IMAGE_PREFIX:-aim-studio}/web:${IMAGE_TAG:-0.2.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: next
      args: { <<: *build, APP: web }
    environment:
      { API_INTERNAL_URL: 'http://api:4000', PUBLIC_URL: '${PUBLIC_URL:-http://localhost:3000}' }
    depends_on: { api: { condition: service_healthy } }
  mobile:
    <<: *runtime
    image: ${IMAGE_PREFIX:-aim-studio}/mobile:${IMAGE_TAG:-0.2.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: next
      args: { <<: *build, APP: mobile }
    environment:
      { API_INTERNAL_URL: 'http://api:4000', PUBLIC_URL: '${PUBLIC_URL:-http://localhost:3000}' }
    depends_on: { api: { condition: service_healthy } }
  docs:
    <<: *runtime
    image: ${IMAGE_PREFIX:-aim-studio}/docs:${IMAGE_TAG:-0.2.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: next
      args: { <<: *build, APP: docs }
    ports: ['${DOCS_PORT:-3002}:3000']
  gateway:
    <<: *runtime
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    ports: ['${WEB_PORT:-3000}:80']
    volumes: ['./nginx/platform.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      {
        web: { condition: service_healthy },
        mobile: { condition: service_healthy },
        api: { condition: service_healthy },
      }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 10s
      retries: 10
  mailpit:
    <<: *runtime
    image: axllent/mailpit:v1.27
    profiles: [dev]
    ports: ['127.0.0.1:${MAILPIT_PORT:-8025}:8025']
  storybook:
    <<: *runtime
    profiles: [storybook]
    image: ${IMAGE_PREFIX:-aim-studio}/storybook:${IMAGE_TAG:-0.2.0}
    build: { context: .., dockerfile: deploy/Dockerfile, target: storybook, args: *build }
    ports: ['${STORYBOOK_PORT:-6006}:80']
  backup:
    profiles: [tools]
    image: postgres:17-alpine
    environment: { PGPASSWORD: '${POSTGRES_PASSWORD}' }
    volumes: [files:/files, './backups:/backups']
    entrypoint: [sh]
volumes:
  postgres-data:
  files:
